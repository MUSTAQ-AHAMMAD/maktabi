# Maktabi Full Stack Docker Compose Configuration
#
# Starts PostgreSQL, backend, and frontend services.
#
# Usage:
#   cp .env.example .env
#   docker-compose up -d
#
# Troubleshooting:
#   If you see "Database is uninitialized and superuser password is not specified",
#   it means an old Docker volume exists. Fix it by running:
#     docker-compose down -v
#     docker-compose up -d
#
#   If you see "port is already allocated" error, it means another service is using
#   the port. Stop the conflicting service or change the port mapping in this file.
#   For example, to use port 9002 instead of 9001 for backend:
#     BACKEND_PORT=9002 docker-compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: maktabi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maktabi_db}
      POSTGRES_USER: ${POSTGRES_USER:-maktabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maktabi123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maktabi} -d ${POSTGRES_DB:-maktabi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maktabi_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9001}:9001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 9001
      FRONTEND_URL: ${FRONTEND_URL}
      PRISMA_CLI_BINARY_TARGETS: "debian-openssl-3.0.x"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maktabi_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  postgres_data:
